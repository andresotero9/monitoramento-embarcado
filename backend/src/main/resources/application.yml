spring:
  application:
    name: monitoramento-embarcado

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/monitoramento}
    username: ${DATABASE_USERNAME:monitoramento}
    password: ${DATABASE_PASSWORD:monitoramento}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-no-minimo-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 horas

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  streaming:
    hls-output-dir: ${HLS_OUTPUT_DIR:/tmp/monitoramento-hls}
    inatividade-timeout-segundos: ${HLS_INATIVIDADE_TIMEOUT:60}
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}

  disco:
    path-padrao: ${DISCO_PATH_PADRAO:/}

  camera:
    credential-secret: ${CAMERA_CREDENTIAL_SECRET:troque-este-segredo-em-producao}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    br.com.monitoramento: INFO
