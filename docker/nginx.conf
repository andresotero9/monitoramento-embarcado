server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota não encontrada como arquivo estático cai no index.html,
    # deixando o Vue Router (modo history) resolver a navegação no client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para a API: o frontend chama sempre "/api/...", nunca a URL
    # direta do backend — evita problemas de CORS em produção e mantém uma
    # única origem do ponto de vista do navegador.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming HLS: segmentos são pequenos e frequentes; desabilita
        # buffering para reduzir a latência percebida na reprodução ao vivo.
        proxy_buffering off;
    }

    # Assets com hash no nome (gerados pelo Vite) podem ser cacheados agressivamente.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
